<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stardust Run</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Pilot a rocket through space, dodge asteroids and debris, and collect stardust. How far can you fly?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#05060f; --ink:#eaf2ff; --dim:#8fa3c8; --cyan:#4be3ff; --gold:#ffd84a; --pink:#ff4fd8; --red:#ff5470;
  --col-left:0px; --col-w:100vw;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;height:100vh;height:100dvh}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.playing canvas{cursor:none}
button{font:inherit;color:inherit;touch-action:manipulation}
svg{display:block}

/* ---------- HUD ---------- */
#ui{position:fixed;top:0;bottom:0;left:var(--col-left);width:var(--col-w);pointer-events:none;z-index:10;
  padding:calc(var(--sat) + 10px) 10px 0}
#ui .hud{display:none}
#ui.playing .hud{display:block}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lives{display:flex;gap:3px;min-width:88px;padding-top:4px}
.heart{width:24px;height:24px;fill:#ff5470;filter:drop-shadow(0 0 6px rgba(255,84,112,.7));transition:transform .25s,opacity .25s,filter .25s}
.heart.lost{fill:#3a4058;opacity:.55;transform:scale(.8);filter:none}
.dist{text-align:center;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dist b{font-size:clamp(26px,min(5.2vh,9.2vw),46px);font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.dist span{font-size:12px;font-weight:800;color:var(--cyan);margin-left:5px;letter-spacing:.1em}
.btns{display:flex;gap:8px;min-width:92px;justify-content:flex-end}
.ico{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:0;background:rgba(10,16,40,.55);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:22px;height:22px;fill:var(--ink)}
.ico:active{transform:scale(.92)}
#btnPause{display:none}
#ui.playing #btnPause{display:grid}
.score{display:flex;align-items:center;gap:7px;margin-top:6px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.score .star{width:22px;height:22px;fill:var(--gold);filter:drop-shadow(0 0 6px rgba(255,216,74,.8))}
.score b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-weight:900;font-size:16px;color:#1a1200;background:linear-gradient(180deg,#ffe98a,#ffb52e);
  padding:2px 9px;border-radius:99px;transform:scale(0);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.score em.on{transform:scale(1)}
.score em.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.combo{width:120px;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:5px;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.combo i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#ffe98a)}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{position:relative;width:44px;height:44px;border-radius:50%;display:none;place-items:center;
  background:rgba(10,16,40,.6);box-shadow:0 0 14px var(--c),inset 0 0 0 2px var(--c)}
.chip.on{display:grid;animation:pop .3s}
.chip canvas{position:static;width:26px;height:26px}
.chip i{position:absolute;left:6px;right:6px;bottom:-7px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.chip i b{display:block;height:100%;background:var(--c);width:100%}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- banners ---------- */
#banner{position:fixed;left:0;right:0;top:19%;text-align:center;pointer-events:none;opacity:0;z-index:8;padding:0 12px}
#banner.show{animation:ban 2.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}8%{opacity:1;transform:scale(1.08)}15%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#banner b{display:block;font-size:clamp(26px,6.5vmin,50px);font-weight:900;letter-spacing:.09em;
  text-shadow:0 0 24px rgba(75,227,255,.7),0 3px 0 rgba(0,0,0,.4)}
#banner span{display:block;margin-top:4px;font-size:clamp(13px,2.6vmin,18px);font-weight:700;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
#banner.alert b{color:var(--red);text-shadow:0 0 24px rgba(255,84,112,.8),0 3px 0 rgba(0,0,0,.4)}
#banner.good b{color:var(--gold);text-shadow:0 0 24px rgba(255,216,74,.7),0 3px 0 rgba(0,0,0,.4)}
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:24vmin;font-weight:900;pointer-events:none;z-index:8;opacity:0;
  text-shadow:0 0 40px rgba(75,227,255,.8);padding-bottom:20vh}
#count.pop{animation:cpop .5s ease-out forwards}
@keyframes cpop{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:.9}100%{opacity:0;transform:scale(.8)}}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 26px);text-align:center;pointer-events:none;z-index:8;
  font-weight:800;letter-spacing:.14em;font-size:14px;color:var(--cyan);text-transform:uppercase;opacity:0;transition:opacity .5s;text-shadow:0 2px 10px #000}
#hint.on{opacity:.95}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:5;text-align:center;
  padding:calc(var(--sat) + 5vh) calc(var(--sar) + 18px) calc(var(--sab) + 16px) calc(var(--sal) + 18px);overflow:hidden}
.screen.show{display:flex;animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#title{background:linear-gradient(180deg,rgba(3,5,16,.62) 0%,rgba(3,5,16,.4) 55%,rgba(3,5,16,0) 80%)}
.logo{margin:2vh 0 0;line-height:.86;font-weight:900;text-transform:uppercase;font-style:italic}
.logo span{display:block}
.logo .l1{font-size:clamp(46px,13vmin,104px);letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6c4 10%,#ffc233 55%,#ff5fb0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(120,30,90,.55)) drop-shadow(0 0 26px rgba(255,150,80,.35))}
.logo .l2{font-size:clamp(38px,10.5vmin,84px);letter-spacing:.32em;margin-top:.08em;padding-left:.32em;
  background:linear-gradient(180deg,#d6fbff,#4be3ff 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(10,60,110,.6))}
.tag{margin:16px 0 20px;color:var(--dim);font-size:clamp(14px,2.4vmin,18px);max-width:30em;line-height:1.35}
.btn{font-weight:900;letter-spacing:.12em;border:0;border-radius:999px;padding:14px 34px;color:#04101f;cursor:pointer;
  font-size:16px;text-transform:uppercase;
  background:linear-gradient(180deg,#a5f6ff,#3fb8ff);box-shadow:0 5px 0 #1a6fa8,0 12px 28px rgba(63,184,255,.4);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1a6fa8,0 6px 16px rgba(63,184,255,.4)}
.btn.primary{font-size:clamp(19px,3.2vmin,26px);padding:16px 54px;background:linear-gradient(180deg,#fff0a0,#ffb52e);
  box-shadow:0 6px 0 #b56d00,0 14px 34px rgba(255,181,46,.45);animation:pulse 1.7s ease-in-out infinite}
.btn.primary:active{box-shadow:0 2px 0 #b56d00,0 8px 20px rgba(255,181,46,.45);animation:none}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
@keyframes pulse{50%{transform:scale(1.045)}}
.paint{margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
#swatches{display:flex;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.15);transition:transform .12s}
.sw.sel{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #fff,0 0 16px var(--c);transform:scale(1.15)}
.howto{margin-top:22px;display:grid;gap:10px;max-width:420px;width:100%;text-align:left}
.howto div{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:16px;background:rgba(10,16,40,.55);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1);font-size:14px;line-height:1.3;color:#cfdcf5}
.howto canvas{position:static;flex:none;width:34px;height:34px}
.howto b{color:#fff}
.rotate{display:none;margin-top:12px;color:var(--gold);font-size:13px;font-weight:700}
@media (orientation:landscape) and (max-height:520px){.rotate{display:block}.howto{display:none}}
@media (max-height:760px){.howto{display:none}.tag{margin:10px 0 14px}.paint{margin-top:16px}}
.ctrl{margin-top:14px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
#pause,#over{background:rgba(3,5,16,.72);justify-content:center}
#pause h2,#over h2{margin:0 0 4px;font-size:clamp(32px,8vmin,56px);font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-style:italic}
#pause .stack,.actions{display:flex;flex-direction:column;gap:14px;margin-top:24px;align-items:center}
.card{margin-top:14px;width:min(420px,100%);padding:18px 18px 16px;border-radius:24px;background:linear-gradient(180deg,rgba(30,44,96,.7),rgba(14,20,52,.75));
  box-shadow:inset 0 0 0 2px rgba(120,170,255,.22),0 20px 50px rgba(0,0,0,.5)}
.rank{display:inline-block;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#1a1200;
  background:linear-gradient(180deg,#ffe98a,#ffb52e);padding:5px 14px;border-radius:99px}
.big{margin:8px 0 0;font-size:clamp(46px,11vmin,74px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.3em;color:var(--cyan);letter-spacing:.14em;margin-left:6px}
.sub{color:var(--dim);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.stats{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{padding:9px 6px;border-radius:14px;background:rgba(0,0,0,.28)}
.stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stats span{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stats .gold b{color:var(--gold)}
.actions{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px}
.actions .primary{flex:1 1 100%}
@media (prefers-reduced-motion:reduce){.btn.primary{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.5S2.6 15.6 2.6 8.9C2.6 5.8 5 3.6 7.7 3.6c1.8 0 3.3.9 4.3 2.4 1-1.5 2.5-2.4 4.3-2.4 2.7 0 5.1 2.2 5.1 5.3 0 6.700-9.400 12.600-9.400 12.600z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.5c.5 4.900 1.900 8.500 3.600 10.100 1.700 1.500 4.600 2.100 8 2.400-3.400.4-6.300 1-8 2.500-1.700 1.600-3.100 5.200-3.600 10-.5-4.800-1.900-8.400-3.600-10-1.700-1.500-4.600-2.100-8-2.500 3.400-.3 6.300-.9 8-2.400C10.100 10 11.500 6.400 12 1.500z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.500"/><rect x="14" y="4" width="5" height="16" rx="1.500"/></symbol>
  <symbol id="i-snd" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.500 8.500a5 5 0 0 1 0 7M18 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="stroke:var(--ink)"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9.500l5 5M21 9.500l-5 5" fill="none" stroke-width="2" stroke-linecap="round" style="stroke:var(--ink)"/></symbol>
</svg>

<canvas id="c"></canvas>

<div id="ui">
  <div class="hud">
    <div class="row">
      <div class="lives" id="lives"></div>
      <div class="dist"><b id="dNum">0</b><span>KM</span></div>
      <div class="btns" style="visibility:hidden"><span class="ico"></span></div>
    </div>
    <div class="score"><svg class="star" width="22" height="22"><use href="#i-star"/></svg><b id="sNum">0</b><em id="mult">x2</em></div>
    <div class="combo" id="combo"><i id="comboBar"></i></div>
    <div class="chips" id="chips"></div>
  </div>
  <div style="position:absolute;top:calc(var(--sat) + 10px);right:10px;display:flex;gap:8px">
    <button class="ico" id="btnMute" aria-label="Toggle sound"><svg><use href="#i-snd"/></svg></button>
    <button class="ico" id="btnPause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
  </div>
</div>

<div id="banner"><b></b><span></span></div>
<div id="count"></div>
<div id="hint"></div>

<div id="title" class="screen show">
  <h1 class="logo"><span class="l1">Stardust</span><span class="l2">Run</span></h1>
  <p class="tag">Dodge the debris. Chase the stars.<br>See how far you can fly.</p>
  <button class="btn primary" id="btnPlay">Launch</button>
  <div class="ctrl" id="ctrl"></div>
  <div class="paint"><span>Paint job</span><div id="swatches"></div></div>
  <div class="howto" id="howto"></div>
  <div class="rotate">Tip: hold your phone upright for the best view.</div>
</div>

<div id="pause" class="screen">
  <h2>Paused</h2>
  <div class="stack">
    <button class="btn primary" id="btnResume">Resume</button>
    <button class="btn ghost" id="btnRestart">Restart</button>
    <button class="btn ghost" id="btnMenu1">Main menu</button>
  </div>
</div>

<div id="over" class="screen">
  <h2 id="ovTitle">Mission over</h2>
  <div class="card">
    <span class="rank" id="ovRank">Cadet</span>
    <div class="big"><span id="ovDist">0</span><small>KM</small></div>
    <div class="sub">Distance flown</div>
    <div class="stats">
      <div class="gold"><b id="ovScore">0</b><span>Stardust points</span></div>
      <div><b id="ovDust">0</b><span>Stars grabbed</span></div>
      <div><b id="ovCombo">x1</b><span>Best combo</span></div>
      <div><b id="ovClose">0</b><span>Close calls</span></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnAgain">Fly again</button>
    <button class="btn ghost" id="btnShare">Share run</button>
    <button class="btn ghost" id="btnMenu2">Menu</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ==========================================================================
   Stardust Run — a one-file rocket dodger.
   All art is drawn in code (canvas), all audio is synthesized (WebAudio).
   ========================================================================== */

// ---------- tiny helpers ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const pick = a => a[(Math.random() * a.length) | 0];
const dcs = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- world constants ----------
const H = 1000;            // logical world height (width varies with screen, capped)
const MAXW = 720;          // widest playfield
const GROUND = 900;        // launch pad surface
const CRUISE = 800;        // default rocket altitude
const MAXHP = 3;
const KM = 50;             // world units per displayed km

// ---------- canvas ----------
const cv = $('c');
const ctx = cv.getContext('2d', { alpha: false });
let dpr = 1, vw = 0, vh = 0, scale = 1, W = 600, viewW = 600, offX = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  scale = vh / H; viewW = vw / scale; W = Math.min(viewW, MAXW); offX = (viewW - W) / 2;
  const root = document.documentElement.style;
  root.setProperty('--col-left', (offX * scale) + 'px');
  root.setProperty('--col-w', (W * scale) + 'px');
  P.tx = clamp(P.tx, 26, W - 26); P.x = clamp(P.x, 26, W - 26);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ==========================================================================
   AUDIO — everything synthesized
   ========================================================================== */
const Snd = (() => {
  let ac = null, master, sfx, mus, musF, noiseBuf, engG, engF, timer = 0;
  let muted = false;
  const M = { on: false, step: 0, next: 0, inten: 0, tempo: 100 };
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
  const PROG = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];   // Am F C G
  const BASS = [45, 41, 48, 43];
  const PENT = [0, 2, 4, 7, 9];
  const ARP = [0, 1, 2, 1, 2, 1, 0, 1];
  const LEAD = [69, 72, 74, 76, 79, 81, 84];

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    musF = ac.createBiquadFilter(); musF.type = 'lowpass'; musF.frequency.value = 5000; musF.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.55; mus.connect(musF);
    const dl = ac.createDelay(1); dl.delayTime.value = 0.3;
    const fb = ac.createGain(); fb.gain.value = 0.34; const wet = ac.createGain(); wet.gain.value = 0.3;
    mus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(musF);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // engine rumble
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    engF = ac.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 160;
    engG = ac.createGain(); engG.gain.value = 0;
    src.connect(engF); engF.connect(engG); engG.connect(sfx); src.start();
    timer = setInterval(schedule, 30);
  }
  function unlock() {
    init(); if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    if (!M.on) { M.on = true; M.next = ac.currentTime + 0.1; M.step = 0; }
  }
  function tone(f, dur, type, vol, o) {
    if (!ac || muted) return; o = o || {};
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
    const a = o.attack || 0.006;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  if (P.magnet > 0 && st === 'playing' && Math.random() < .3) { const a = rand(0, TAU); emit(P.x + Math.cos(a) * magR, P.y + Math.sin(a) * magR, -Math.cos(a) * 260, -Math.sin(a) * 260, .7, 3, { h: 310, l: 70, f: 0 }); }
  for (let i = parts.length - 1; i >= 0; i--) {

  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; r.r = lerp(r.r, r.r1, Math.min(1, dt * 9)); r.y += sdt * .6; if (r.life <= 0) rings.splice(i, 1); }

  updateHUD(dt);
}

function onSector(sec) {
  G.sector = sec; const info = sectorInfo(sec);
  G.hueT = info[1]; nebNext = makeNebula(info[1]); G.nebFade = 0;
  banner('SECTOR ' + sec, info[0], 'good'); Snd.sector(); addScore(100); ptext(P.x, P.y - 90, 'SECTOR BONUS +100', '#ffd84a', 22);
  Snd.music(Math.min(4, 1 + Math.floor((sec - 1) / 2)), 100 + Math.min(sec, 10) * 3);
  if (sec % 2 === 0) spawnDeco(false);
}

let lastKm = -1, lastScore = -1, lastMult = 0;
function updateHUD(dt) {
  const km = Math.floor(G.dist / KM); if (km !== lastKm) { lastKm = km; hud.d.textContent = km.toLocaleString(); }
  G.shownScore += (G.score - G.shownScore) * Math.min(1, dt * 12); const sc = Math.round(G.shownScore);
  if (sc !== lastScore) { lastScore = sc; hud.s.textContent = sc.toLocaleString(); }
  const m = G.comboT > 0 ? mult() : 1;
  if (m !== lastMult) { lastMult = m; hud.mult.textContent = 'x' + m; hud.mult.classList.toggle('on', m > 1); }
  hud.combo.classList.toggle('on', G.comboT > 0); hud.bar.style.width = (clamp(G.comboT / 2.2, 0, 1) * 100).toFixed(0) + '%';
  for (const k of ['shield', 'magnet', 'slow']) {
    const v = P[k], mx = k === 'shield' ? 15 : k === 'magnet' ? 9 : 5.5, c = chipEls[k];
    const on = v > 0 && G.state === 'playing'; c.el.classList.toggle('on', on); if (on) c.bar.style.width = (v / mx * 100).toFixed(0) + '%';
  }
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function render() {

  sg.addColorStop(0, `hsl(${hue},55%,5%)`); sg.addColorStop(1, `hsl(${(hue + 25) % 360},50%,13%)`);
  c.fillStyle = sg; c.fillRect(0, 0, vw, vh);
  c.setTransform(1, 0, 0, 1, 0, 0);
  { const cw = cv.width, ch = cv.height, ny = Math.round(G.nebScroll * ch), a = nebNext ? 1 - smooth(G.nebFade) : 1;
    c.globalAlpha = a * .8; c.drawImage(nebCur, 0, ny - ch, cw, ch); c.drawImage(nebCur, 0, ny, cw, ch);
    if (nebNext) { c.globalAlpha = smooth(G.nebFade) * .8; c.drawImage(nebNext, 0, ny - ch, cw, ch); c.drawImage(nebNext, 0, ny, cw, ch); }
    c.globalAlpha = 1; }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

    c.globalAlpha = s.a * tw; c.fillStyle = s.z > .8 ? '#cfe6ff' : s.z > .4 ? '#ffffff' : '#a8b8e8';
    c.fillRect(s.x * vw, s.y * vh, s.s, s.s + len);
  }
  c.globalAlpha = 1;

  // world transform (with shake)
  const shk = reduceMotion ? G.shake * .3 : G.shake, sx = (Math.random() - .5) * shk, sy = (Math.random() - .5) * shk;
  c.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * scale * (offX + sx), dpr * scale * sy);

  for (const d of decos) drawDeco(c, d);
  drawEarth(c, ts);

  // dust

  for (const d of dust) { const p = .85 + .15 * Math.sin(ts * 6 + d.ph), r = d.big ? 46 : 30; c.globalAlpha = .55 * p; c.drawImage(glow(d.big ? '255,160,60' : '255,200,70'), d.x - r, d.y - r, r * 2, r * 2); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  for (const d of dust) {
    const p = .9 + .12 * Math.sin(ts * 6 + d.ph), sz = (d.big ? 44 : 26) * p; c.save(); c.translate(d.x, d.y); c.rotate(Math.sin(ts * 2 + d.ph) * .35 + (d.big ? ts * .8 : 0));
    c.drawImage(d.big ? bigSprite : dustSprite, -sz / 2, -sz / 2, sz, sz); c.restore();
  }
  // pickups
  for (const p of pups) {
    const def = PU[p.k], bob = Math.sin(ts * 3 + p.ph) * 4, pulse = 1 + Math.sin(ts * 5 + p.ph) * .07;
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = .75; c.drawImage(glow(def.rgb), p.x - 62, p.y + bob - 62, 124, 124); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const sz = 52 * pulse; c.drawImage(orbSprites[p.k], p.x - sz / 2, p.y + bob - sz / 2, sz, sz);
    c.strokeStyle = `rgba(${def.rgb},${.5 - .4 * ((ts * 1.2 + p.ph) % 1)})`; c.lineWidth = 3; c.beginPath(); c.arc(p.x, p.y + bob, 28 + ((ts * 1.2 + p.ph) % 1) * 24, 0, TAU); c.stroke();
  }

  // obstacles
  for (const o of obs) drawObs(c, o, ts);
  // rocket
  if (P.alive && (G.state !== 'over')) {
    const blink = P.invuln > 0 && P.shield <= 0 ? (Math.floor(ts * 14) % 2 ? .35 : .95) : 1;
    const fl = G.state === 'title' ? .35 : G.state === 'launch' ? (G.lt < 1.5 ? .4 + G.lt * .3 : 1) : .55 + G.speed / 1800;
    if (G.state === 'launch' || G.state === 'title') drawPad(c);
    drawRocket(c, P.x, P.y, P.tilt, fl, ts, blink, paint);
    if (P.shield > 0) drawShield(c, ts);
    if (P.magnet > 0) { const u = (ts * 1.3) % 1; c.strokeStyle = `rgba(255,79,216,${.35 * (1 - u)})`; c.lineWidth = 3; c.beginPath(); c.arc(P.x, P.y, 230 * u, 0, TAU); c.stroke(); }
  } else if (G.state === 'title') drawPad(c);

  for (const t of texts) {

    c.fillStyle = 'rgba(2,4,14,.3)'; c.fillRect(-offX - 5, 0, offX + 5, H); c.fillRect(W, 0, offX + 5, H);
    const eg = c.createLinearGradient(0, 0, 0, H); eg.addColorStop(0, 'rgba(75,227,255,0)'); eg.addColorStop(.5, 'rgba(75,227,255,.5)'); eg.addColorStop(1, 'rgba(75,227,255,.15)');

}

function drawEarth(c, ts) {
  const top = GROUND + G.earthOff; if (top > H + 40) return;
  const cx = W / 2, R = 1600, cy = top + R;
  c.save();
  const g = c.createRadialGradient(cx - 200, top + 120, 40, cx, cy, R);
  g.addColorStop(0, '#5ec2ff'); g.addColorStop(.06, '#2f86e0'); g.addColorStop(.3, '#1a4fa8'); g.addColorStop(1, '#081c47');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  const rr = mulberry(77);
  for (let i = 0; i < 26; i++) { const x = cx + (rr() - .5) * 1500, y = top + 16 + rr() * 260, w = 70 + rr() * 200; c.fillStyle = `rgba(255,255,255,${.1 + rr() * .3})`; c.beginPath(); c.ellipse(x, y, w, 8 + rr() * 16, 0, 0, TAU); c.fill(); }
  for (let i = 0; i < 40; i++) { const x = cx + (rr() - .5) * 1100, y = top + 30 + rr() * 300; c.fillStyle = 'rgba(30,170,90,.35)'; c.beginPath(); c.ellipse(x, y, 20 + rr() * 60, 6 + rr() * 12, rr(), 0, TAU); c.fill(); }
  c.restore();
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) { c.strokeStyle = `rgba(90,190,255,${.28 - i * .06})`; c.lineWidth = 8 + i * 12; c.beginPath(); c.arc(cx, cy, R + 4 + i * 8, 0, TAU); c.stroke(); }
  c.restore();
}
function drawPad(c) {
  const top = GROUND + G.earthOff, cx = W / 2;
  c.fillStyle = '#2b3350'; c.fillRect(cx - 74, top - 6, 148, 14); c.fillStyle = '#586387'; c.fillRect(cx - 74, top - 6, 148, 3);
  // gantry tower
  const tx = cx - 60; c.fillStyle = '#6b7799'; c.fillRect(tx - 8, top - 96, 8, 92); c.fillRect(tx + 6, top - 96, 4, 92);
  c.fillStyle = '#4b5676'; for (let i = 0; i < 6; i++) c.fillRect(tx - 8, top - 92 + i * 16, 18, 3);
  c.fillRect(tx + 8, top - 70, 26, 5);
  c.fillStyle = Math.floor(G.clock * 2) % 2 ? '#ff5470' : '#5a1520'; c.beginPath(); c.arc(tx - 4, top - 100, 3.5, 0, TAU); c.fill();
  // legs

}
function drawShield(c, ts) {
  const low = P.shield < 3 && Math.floor(ts * 8) % 2, r = 50;
  if (low) return;
  const g = c.createRadialGradient(P.x, P.y, r * .4, P.x, P.y, r); g.addColorStop(0, 'rgba(75,227,255,0)'); g.addColorStop(.8, 'rgba(75,227,255,.18)'); g.addColorStop(1, 'rgba(160,250,255,.55)');
  c.fillStyle = g; c.beginPath(); c.arc(P.x, P.y, r, 0, TAU); c.fill();
  c.strokeStyle = `rgba(150,245,255,${.55 + .25 * Math.sin(ts * 8)})`; c.lineWidth = 2.5; c.beginPath(); c.arc(P.x, P.y, r, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 3; c.beginPath(); c.arc(P.x, P.y, r - 5, 3.9 + ts, 4.6 + ts); c.stroke();
}
function drawWarn(c, w, ts) {
  const u = w.t / w.dur, pulse = Math.abs(Math.sin(ts * 16)), k = (y) => w.x + (w.ax - w.x) * (y + 70) / (P.y + 70), my = 178, mx = clamp(k(my), 30, W - 30);
  c.save(); c.setLineDash([14, 14]); c.lineDashOffset = -ts * 90; c.strokeStyle = `rgba(255,84,112,${.2 + .3 * u})`; c.lineWidth = 4;
  c.beginPath(); c.moveTo(k(0), 0); c.lineTo(k(P.y), P.y); c.stroke(); c.restore();
  const s = 1 + u * .25 + pulse * .1;
  c.save(); c.translate(mx, my); c.scale(s, s);
  c.fillStyle = `rgba(255,84,112,${.65 + .35 * pulse})`; c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(0, -24); c.lineTo(24, 18); c.lineTo(-24, 18); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.font = '900 26px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('!', 0, 13);
  c.restore();
}
function drawObs(c, o, ts) {
  c.save(); c.translate(o.x, o.y);
  if (o.k === 'rock') {
    if (o.hot) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = .7; c.drawImage(glow('255,120,40'), -o.r * 2.4, -o.r * 2.4, o.r * 4.8, o.r * 4.8); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
    c.rotate(o.rot); const s = o.r * 2.63; c.drawImage(o.spr, -s / 2, -s / 2, s, s);
  } else if (o.k === 'sat') { c.rotate(o.rot); c.drawImage(satSprite, -90, -84 / 2 - 4 + 0, 180, 80); }
  else if (o.k === 'tank') { c.rotate(o.rot); c.drawImage(tankSprite, -22.5, -42.5, 45, 85); }
  else if (o.k === 'shard') { c.rotate(o.rot); const s = o.r * 3.3; c.drawImage(o.spr, -s / 2, -s / 2, s, s); }
  else if (o.k === 'comet') {
    const ang = Math.atan2(o.vy + G.scroll, o.vx) - Math.PI / 2, len = 300 + G.speed * .12;
    c.rotate(ang);
    c.globalCompositeOperation = 'lighter';
    let g = c.createLinearGradient(0, 0, 0, -len); g.addColorStop(0, 'rgba(255,190,90,.9)'); g.addColorStop(.35, 'rgba(255,90,60,.4)'); g.addColorStop(1, 'rgba(255,60,120,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(-17, 0); c.lineTo(0, -len); c.lineTo(17, 0); c.closePath(); c.fill();
    g = c.createLinearGradient(0, 0, 0, -len * .6); g.addColorStop(0, 'rgba(150,230,255,.7)'); g.addColorStop(1, 'rgba(150,230,255,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(-9, 0); c.lineTo(0, -len * .6); c.lineTo(9, 0); c.closePath(); c.fill();
    c.globalAlpha = .9; c.drawImage(glow('255,170,80'), -50, -50, 100, 100);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const cg = c.createRadialGradient(-4, -4, 1, 0, 0, 16); cg.addColorStop(0, '#ffffff'); cg.addColorStop(.6, '#ffd08a'); cg.addColorStop(1, '#ff7a3a');

    c.fillStyle = '#4a556e'; for (let i = 0; i < 8; i++) { c.save(); c.rotate(i * TAU / 8); c.beginPath(); c.moveTo(-5, -14); c.lineTo(0, -29); c.lineTo(5, -14); c.closePath(); c.fill(); c.restore(); }
    const mg = c.createRadialGradient(-6, -7, 2, 0, 0, 20); mg.addColorStop(0, '#8b97b5'); mg.addColorStop(.6, '#3a4463'); mg.addColorStop(1, '#161b2e');
    c.fillStyle = mg; c.beginPath(); c.arc(0, 0, 19, 0, TAU); c.fill(); c.strokeStyle = '#0b0f1c'; c.lineWidth = 2; c.stroke();

    c.globalCompositeOperation = 'lighter'; c.globalAlpha = .5 + .5 * p; c.drawImage(glow('255,50,70'), -26, -26, 52, 52); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.fillStyle = `rgb(255,${90 + p * 100 | 0},${90 + p * 60 | 0})`; c.beginPath(); c.arc(0, 0, 6, 0, TAU); c.fill();
  }
  c.restore();
}
function drawParticles(c) {
  for (let pass = 0; pass < 2; pass++) {
    c.globalCompositeOperation = pass ? 'lighter' : 'source-over';
    for (const p of parts) {
      if (!!p.add !== !!pass) continue;
      const a = clamp(p.life / p.max, 0, 1);
      if (p.chip) { c.globalAlpha = a; c.fillStyle = p.col; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66); c.restore(); }
      else if (pass) { c.fillStyle = `hsla(${p.h + (1 - a) * -25},${p.s}%,${p.l * (.6 + .4 * a)}%,${a})`; c.beginPath(); c.arc(p.x, p.y, Math.max(.5, p.size * (.4 + .6 * a)), 0, TAU); c.fill(); }
      else { c.fillStyle = `hsla(${p.h},${p.s}%,${p.l}%,${a * .55})`; c.beginPath(); c.arc(p.x, p.y, Math.max(.5, p.size), 0, TAU); c.fill(); }
    }

}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
  if (!G.paused) update(dt);
  render(); requestAnimationFrame(frame);
}
resize(); resetRun(); spawnDeco(true); spawnDeco(true);
G.state = 'title'; G.speedS = 45;
requestAnimationFrame(frame);

// tiny debug/test surface
window.__stardust = { G, P, obs, dust, pups, warns, step(n, dt) { for (let i = 0; i < n; i++) update(dt || 1 / 60); render(); }, render, update, enterPhase, startRun, get W() { return W; }, get H() { return H; } };
})();
